# release-trampoline -- the tag-push entry (design D1). DELIBERATELY thin:
# a tag-push executes the TAG-COMMIT's YAML ("Each workflow run will use the
# version of the workflow that is present in the associated commit SHA or Git
# ref of the event" -- measured, GitHub docs), so an old tag would judge
# retags with OLD logic if the logic lived here. All brains are in
# release-core.yml@main; this file only forwards the event. Keep it stable.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # must cover the called workflow's needs (Release API)

jobs:
  release:
    uses: VOTV-MP/Multivoid/.github/workflows/release-core.yml@main
    with:
      tag-name: ${{ github.ref_name }}
      tag-sha: ${{ github.sha }}   # evidence only; release-core re-resolves the tag
    # The publish job's release key is an ENVIRONMENT secret: a job reached through workflow_call reads it only
    # when the caller passes secrets (measured 2026-11-14: run 43602442292, plain EMPTY, inherit set).
    secrets: inherit
