# release-key-probe -- a one-off diagnosis, removed after use: does a job in the release environment see
# the MULTIVOID_RELEASE_KEY secret? It prints only whether it is set and its length, never the value.
name: release-key-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Is the release key visible here
        env:
          KEY: ${{ secrets.MULTIVOID_RELEASE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "PROBE: MULTIVOID_RELEASE_KEY is EMPTY in this job"; else echo "PROBE: MULTIVOID_RELEASE_KEY is set, length ${#KEY}"; fi
