# release-key-probe -- a one-off diagnosis, removed after use: does the release environment's key reach a
# job called through workflow_call, without and with `secrets: inherit`? Prints only set/empty and length.
name: release-key-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plain:
    uses: VOTV-MP/Multivoid/.github/workflows/release-key-probe-core.yml@main
    with:
      form: plain
  inherit:
    uses: VOTV-MP/Multivoid/.github/workflows/release-key-probe-core.yml@main
    with:
      form: inherit
    secrets: inherit
