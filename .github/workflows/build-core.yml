# build-core -- the ONE build implementation (design D11); two entries call it:
#   build.yml      (CI lane, cache ON)   -- arrives on main via the PR #2 merge
#   release-core   (release lane, cache OFF / cacheless)
# Callers MUST use the REMOTE form
#   VOTV-MP/Multivoid/.github/workflows/build-core.yml@main
# -- a local-path `uses:` resolves from the TRIGGERING branch, letting a
# contrib branch shadow this file while the caller's diff reads clean (R22).
# Changes here land only as human commits on main; this file's sha256 is part
# of the release fingerprint (tools/release/fingerprint.json, design D3/R23).
# Build steps based on PR #2 by huoyan1231 (reworked per design D2).
name: build-core

on:
  workflow_call:
    inputs:
      ref:
        description: commit sha / ref to build
        required: true
        type: string
      source-sha:
        description: full sha the checked-out tree MUST resolve to (caller-agnostic self-check, R26/R27)
        required: true
        type: string
      use-cache:
        description: restore/save vcpkg caches (CI lane ON; release lane OFF)
        required: false
        type: boolean
        default: true
    outputs:
      artifact-name:
        description: name of the uploaded DLL artifact
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Windows x64 Release
    runs-on: windows-latest
    # GNS + webrtc cold build takes a while; GitHub cap is 360 min.
    timeout-minutes: 360
    outputs:
      artifact-name: ${{ steps.artname.outputs.name }}
    env:
      # Our OWN pinned vcpkg copy -- never the runner's preinstalled C:\vcpkg
      # (a drifting moving target). Pinned to vcpkg.json's builtin-baseline
      # commit, parsed at run time (self-syncing with the package pin).
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg-tool
      VCPKG_TRIPLET: x64-windows-static
      BUILD_DIR: build/votv-coop

    steps:
      - name: Checkout (full history; submodules selectively below)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          submodules: false
          # Full clone: submodule-pinned commits + vcpkg versions DB need history.
          fetch-depth: 0

      - name: Self-check -- tree is the requested source (R27)
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          Write-Host "HEAD       = $head"
          Write-Host "source-sha = ${{ inputs.source-sha }}"
          Write-Host "github.sha = ${{ github.sha }} (evidence only -- on a recovery dispatch this is main's HEAD while the tree is the tag's)"
          if ($head -ne '${{ inputs.source-sha }}') { throw "checkout mismatch: HEAD $head != source-sha ${{ inputs.source-sha }}" }

      - name: Init build submodules (third_party only; reference/* never fetched)
        shell: pwsh
        run: git submodule update --init --recursive src/votv-coop/third_party

      - name: Ensure opus submodule present (BUILDING.md troubleshooting fallback)
        # Old clones lack the opus .gitmodules entry; --recursive then skips
        # the gitlink silently and configure fails.
        shell: pwsh
        run: |
          $opus = 'src/votv-coop/third_party/opus'
          if (-not (Test-Path (Join-Path $opus 'CMakeLists.txt'))) {
            Write-Host 'opus submodule empty -> cloning v1.5.2 directly'
            Remove-Item -Recurse -Force $opus -ErrorAction SilentlyContinue
            git clone --depth 1 -b v1.5.2 https://github.com/xiph/opus.git $opus
          } else { Write-Host 'opus present, ok' }

      - name: Config registry gate (arc 3 C5 -- dead rows / write-only / alias / ratchet surface)
        # Standing gate with fixture-injected must-fire controls each run; the
        # script exits explicitly (pwsh last-child-code lesson). Cheap text
        # scan -- runs before the expensive toolchain steps so a violation
        # fails fast on both the CI and release lanes.
        shell: pwsh
        run: |
          pwsh -File tools/config/registry_gate.ps1
          exit $LASTEXITCODE

      - name: Peer-slot generation gate (arc A T3 -- every peerConns_ write decides occupancy)
        # Same shape as the config gate: fixture must-fire controls each run,
        # explicit exit, cheap text scan before the toolchain steps. Censuses by
        # OPERATION KIND (store AND exchange) because a one-verb census already
        # missed two clear sites once.
        shell: pwsh
        run: |
          pwsh -File tools/net/peerconn_gate.ps1
          exit $LASTEXITCODE

      - name: MinHook free-call gate (nothing may free a trampoline the process still calls)
        # Same family as the gates above: a cheap text scan with its own injected must-fire
        # control, run before the toolchain so a violation fails fast. Guards the property
        # that ue_wrap/core/hook.h states in prose and that PROSE ALONE DID NOT HOLD -- the
        # header contradicted itself five lines apart for four months and a 2026-05-27 audit
        # cleared the resulting use-after-free by trusting a variable name. -Drill also runs
        # the INVERSE control, so a decorative allowlist cannot pass as a working one.
        shell: pwsh
        run: |
          pwsh -File tools/hooks/minhook_free_gate.ps1 -Drill -Quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File tools/hooks/minhook_free_gate.ps1
          exit $LASTEXITCODE

      - name: Atlas regime gate (the ImGui lazy atlas is on, watched, and bounded)
        # Same family: positive census, fail-closed on an empty or unexpected one,
        # with -Drill's injected must-fire controls run first so a green is
        # evidence rather than silence. Guards the four properties of the
        # 2026-07-30 flip that no compile can see -- both RHIs in ONE regime, the
        # watch still asserting it, TexMax pinned off ImGui's 8192 default, and an
        # exclude table that cannot be a zero-terminated no-op.
        shell: pwsh
        run: |
          pwsh -File tools/text/atlas_regime_gate.ps1 -Drill -Quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -File tools/text/atlas_regime_gate.ps1
          exit $LASTEXITCODE

      - name: Read vcpkg pin (builtin-baseline from vcpkg.json)
        id: baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content src/votv-coop/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw "bad builtin-baseline: '$baseline'" }
          Write-Host "vcpkg pin = $baseline"
          "sha=$baseline" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Detect Visual Studio toolchain
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          # Prefer the newest VS that has the C++ toolset; fall back to newest.
          $major = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property catalog_productLineVersion
          if (-not $major) { $major = & $vswhere -latest -property catalog_productLineVersion }
          $major = "$major".Trim()
          # Major -> release year (BUILDING.md: VS 2026 == 18).
          $yearMap = @{ '16' = '2019'; '17' = '2022'; '18' = '2026'; '19' = '2029' }
          $year = $yearMap[$major]
          if (-not $year) { throw "Unrecognized Visual Studio major '$major' -- extend yearMap" }
          $generator = "Visual Studio $major $year"
          $inst = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolset = (Get-Content (Join-Path "$inst".Trim() 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          Write-Host "generator=$generator toolset=$toolset image=$env:ImageVersion"
          "generator=$generator" | Out-File -Append $env:GITHUB_OUTPUT
          "toolset=$toolset"     | Out-File -Append $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" | Out-File -Append $env:GITHUB_OUTPUT

      # Cache keys carry ImageVersion + the detected VC toolset (closes the
      # stale-cache MSVC trap: vcpkg-built protobuf must match the project
      # generator's MSVC within ONE run -- __std_*_trivial_N link errors).
      - name: Restore vcpkg tool cache
        if: ${{ inputs.use-cache }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ steps.baseline.outputs.sha }}-${{ steps.vs.outputs.image }}

      - name: Install vcpkg (clone full + checkout the baseline pin + bootstrap)
        shell: pwsh
        run: |
          $pin = '${{ steps.baseline.outputs.sha }}'
          if (-not (Test-Path "$env:VCPKG_ROOT\.git")) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          }
          $cur = (git -C $env:VCPKG_ROOT rev-parse HEAD).Trim()
          if ($cur -ne $pin) {
            git -C $env:VCPKG_ROOT fetch origin $pin
            git -C $env:VCPKG_ROOT checkout --force $pin
          }
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw 'bootstrap-vcpkg failed' }
          }
          Write-Host "vcpkg at $((git -C $env:VCPKG_ROOT rev-parse HEAD).Trim())"

      - name: Restore vcpkg_installed cache
        if: ${{ inputs.use-cache }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.BUILD_DIR }}/vcpkg_installed
          key: vcpkg-installed-${{ hashFiles('src/votv-coop/vcpkg.json') }}-${{ steps.vs.outputs.image }}-${{ steps.vs.outputs.toolset }}

      - name: Ledger lint (ADVISORY -- data anchored to origin/main, R28)
        # The script runs from THIS tree, but its DATA is main's ledger; no
        # release invariant rides this step -- the enforcing lint + judge run
        # from checkout#2 on the release lane.
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          $tmp = Join-Path $env:RUNNER_TEMP 'LEDGER.main.tsv'
          git show origin/main:tools/release/LEDGER.tsv | Out-File -Encoding utf8 $tmp
          pwsh -File tools/release/ledger_lint.ps1 -LedgerPath $tmp

      - name: Configure (CMake + vcpkg manifest mode)
        shell: pwsh
        run: |
          cmake -S src/votv-coop -B ${{ env.BUILD_DIR }} `
            -G "${{ steps.vs.outputs.generator }}" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }} `
            -DVCPKG_MANIFEST_MODE=ON

      - name: Build (Release)
        shell: pwsh
        run: cmake --build ${{ env.BUILD_DIR }} --config Release

      - name: ABI gate (D-3 -- the built DLL imports NOTHING from UE4SS)
        # The C-ABI slim contract's whole payoff is a number: 0 imported UE4SS
        # symbols (field mods import 32-130 mangled ones and stop loading when
        # the user's UE4SS differs -- docs/UE4SS_ARC.md 7.2b, DebugMod_ARC 6a).
        # Reads the BUILT artifact's PE import directories, so it runs after the
        # build, unlike the text gates above. --drill is the injected must-fire
        # control (a synthesized violator PE), same family as those gates; the
        # field-shaped RED (--selftest against DebugMod's real binary) needs a
        # foreign binary and stays a local-rig check.
        shell: pwsh
        run: |
          python tools/loader/abi_gate.py --drill
          python tools/loader/abi_gate.py "${{ env.BUILD_DIR }}/Release/main.dll"

      - name: Collect artifacts + toolchain dump
        id: artname
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'artifact'
          New-Item -ItemType Directory $out | Out-Null
          $dlls = @(Get-ChildItem "${{ env.BUILD_DIR }}/Release/*.dll")
          if ($dlls.Count -eq 0) { throw 'no DLLs produced' }
          foreach ($d in $dlls) {
            Copy-Item $d.FullName $out
            $h = (Get-FileHash -Algorithm SHA256 $d.FullName).Hash.ToLowerInvariant()
            Write-Host "$($d.Name)  sha256=$h"
          }
          $head = (git rev-parse HEAD).Trim()
          "commit: $head" | Out-File (Join-Path $out 'build-info.txt')
          # Toolchain facts for the human fingerprint commit (cacheless smoke, design section 5 step 4).
          pwsh -File tools/release/fingerprint.ps1 -Mode dump | Tee-Object (Join-Path $out 'fingerprint-dump.json')
          "dir=$out" | Out-File -Append $env:GITHUB_OUTPUT
          # Artifact NAME carries the source sha (CI evidence, not distribution);
          # the DLL filename inside stays canonical (main.dll -- the UE4SS
          # mod-folder contract name; identity rides its VERSIONINFO).
          "name=multivoid-ci-$($head.Substring(0,12))" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artname.outputs.name }}
          path: ${{ steps.artname.outputs.dir }}
          retention-days: 30
          if-no-files-found: error
