# build.yml -- the CI lane's entry (design D1/D2/D11).
name: build

on:
  push:
    branches:
      - custom-content-b133
  workflow_dispatch:
    inputs:
      cacheless:
        description: build without caches (the release-path smoke)
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: VOTV-MP/Multivoid/.github/workflows/build-core.yml@main
    with:
      ref: ${{ github.sha }}
      source-sha: ${{ github.sha }}
      use-cache: ${{ !inputs.cacheless }}
