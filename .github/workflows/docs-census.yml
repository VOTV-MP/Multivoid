# docs-census -- the machine that reads the Docs-Census trailers back.
#
# tools/docs/status_census.py writes one `Docs-Census:` trailer into every
# `[docs] close:` commit (docs/DOCUMENTIZE_ARC.md WP-1). This workflow is the
# reader outside the run that wrote it: tools/docs/docs_census_gate.py judges
# every close commit after the boundary -- the commit that ADDED this file,
# computed by the gate itself, never typed here -- for the trailer's presence,
# the verdict-sum identity, base= tiling, a fresh census= and the ratchet.
#
# Its own workflow file ON PURPOSE: build-core.yml's sha256 is part of the
# release fingerprint (tools/release/fingerprint.json), so a gate step there
# would cost the fingerprint ritual on every edit.
name: docs-census

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Docs-Census trailer gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history -- the gate walks from its own boundary commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gate drill (the gate is shown RED on a synthetic history before it is trusted)
        run: python3 tools/docs/docs_census_gate_drill.py

      # The census's OWN drill -- ~110 checks over the label grammar, the citation content rung, the
      # resolved ledger, the reading order and every refusal path. It ran only when a session chose to
      # run it, so a regression in status_census.py would have shipped silently. It builds its own
      # scratch repos and needs neither the memory directory nor a network (verified with
      # MULTIVOID_MEMORY_DIR pointed at a path that does not exist).
      - name: Census drill (the label grammar, the rungs, the ledger, the refusals)
        run: python3 tools/docs/status_census_drill.py

      # The LEDGER gate's own drill. Round 4 added the census drill here after finding that a
      # regression could ship silently; the SAME round then added three refusal paths to
      # `lessons_gate.py` whose drill had no arm for any of them and which `[V]` nothing in .github
      # ran at all. Round 5 found two defects living in exactly that gap (one list read by two
      # different matchers; a premise measured against `git ls-files` while the decider walked the
      # filesystem). The lesson was applied to one instrument and not to its sibling.
      #
      # Its ledger-injection arms need the memory corpus, which CI does not have; the arms that do
      # not (`drill_allowlist`) run everywhere. Both are inside the one script.
      - name: Ledger gate drill (the allowlist predicates, and the gate shown RED)
        run: python3 tools/docs/lessons_gate_drill.py

      # The PUBLIC-LEAK gate and its drill. This class was caught twice in one day by a hand-run
      # pre-push audit and zero times by any instrument, while everything else in the arc had a gate.
      # In CI the S4 overlap signal reports `n/a` -- CI has neither CLAUDE.md (gitignored) nor the
      # memory directory, so it says so rather than reporting a false all-clear; S1/S2/S3 run here.
      - name: Public-leak gate drill (both founding incidents, every signal RED and quiet)
        run: python3 tools/docs/public_leak_gate_drill.py

      - name: Public-leak gate
        run: python3 tools/docs/public_leak_gate.py

      - name: Docs-Census gate
        run: python3 tools/docs/docs_census_gate.py --report
