# docs-census -- the machine that reads the Docs-Census trailers back.
#
# tools/docs/status_census.py writes one `Docs-Census:` trailer into every
# `[docs] close:` commit (docs/DOCUMENTIZE_ARC.md WP-1). This workflow is the
# reader outside the run that wrote it: tools/docs/docs_census_gate.py judges
# every close commit after the boundary -- the commit that ADDED this file,
# computed by the gate itself, never typed here -- for the trailer's presence,
# the verdict-sum identity, base= tiling, a fresh census= and the ratchet.
#
# Its own workflow file ON PURPOSE: build-core.yml's sha256 is part of the
# release fingerprint (tools/release/fingerprint.json), so a gate step there
# would cost the fingerprint ritual on every edit.
name: docs-census

on:
  push:
    branches: [main]
  pull_request:

# WHAT THIS RUNS, AND WHAT IT DELIBERATELY DOES NOT (USER 2026-09-04).
#
# The three TOOLING drills -- docs_census_gate_drill, status_census_drill,
# lessons_gate_drill -- were here and are gone. They guard `tools/docs/`, which
# serves an internal session-close ritual whose skill and arc are local-only; the
# session that edits that tooling is the session that runs its drills. Their whole
# CI value was catching an edit made without running them, and against that: their
# ONLY signal in their life here was three FALSE failures on the day they were
# added, each because they were wired in without being run in CI's environment
# (no memory corpus, no CLAUDE.md, no research/). The obligation moved into the
# skill text instead of being paid for with a red board.
#
# What stays is what is not about the ritual:
#   - the PUBLIC-LEAK gate, which scans the standing public tree for a leaked
#     security coordinate on every push. That protects THIS REPO, and it would
#     have caught two of the three leaks found by hand on 2026-09-04.
#   - its drill, because a gate nothing shows failing is a gate nobody can trust,
#     and this one guards the repo rather than the ritual.
#   - the Docs-Census trailer gate, which polices a commit-message convention any
#     future session or model tier could break by hand-committing a close. The
#     close script refuses first; this is the backstop for a close that skipped it.

jobs:
  gate:
    name: Docs-Census trailer gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history -- the gate walks from its own boundary commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Public-leak gate drill (both founding incidents, every signal RED and quiet)
        run: python3 tools/docs/public_leak_gate_drill.py

      - name: Public-leak gate
        run: python3 tools/docs/public_leak_gate.py

      - name: Docs-Census gate
        run: python3 tools/docs/docs_census_gate.py --report
