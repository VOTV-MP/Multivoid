# Positive control for the sanitize drill (design section 4, R25): a benign
# self-authored on:push workflow, direct-pushed by the admin. Its run FIRING
# proves the zero-runs assertion instrument can show non-zero. Deleted after.
name: drill-echo
on: push
jobs:
  echo:
    runs-on: windows-latest
    steps:
      - name: echo
        shell: pwsh
        run: Write-Host "positive control fired on $env:GITHUB_REF"
