# repo-gates -- the checks on the repository's public surface, on every push.
#
# Four gates, each with the drill that shows it RED first (a gate nothing can
# show failing is a gate nobody can trust):
#   - public-leak: a leaked security coordinate in the public tree (its verbatim-overlap
#     ratchet needs the maintainer's local trees and reports n/a here; the three line
#     signals run everywhere)
#   - commit messages: the shape CONTRIBUTING.md asks for, over every commit
#     since the checker was added (.github/ci/commit_msg_check.py, the same
#     script the commit-msg hook runs)
#   - public prose: the working-notes markers, dead links and oversized files
#     in the public tree may not grow (.github/ci/public_prose_gate.py, a
#     ratchet against its committed baseline)
#   - ledger lint, offline: the ledger's fold grammar, and the claims the README
#     and docs/install.md make about the tree they ship from
#     (.github/ci/ledger_lint.ps1 -SkipApi; the release-drift rows need the API
#     and stay in the release lane)
#
# Its own workflow file on purpose: build-core.yml's sha256 is part of the
# release fingerprint, so a gate step there would cost the fingerprint ritual
# on every edit.
name: repo-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Public-surface gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history -- the commit-message gate walks from its own boundary)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Public-leak gate drill
        run: python3 .github/ci/public_leak_gate_drill.py

      - name: Public-leak gate
        run: python3 .github/ci/public_leak_gate.py

      - name: Commit-message check drill
        run: python3 .github/ci/commit_msg_check_drill.py

      # A pull request is checked out as the ephemeral merge commit GitHub builds from the branch and
      # the base. That commit's `Merge <sha> into <sha>` subject can never pass, and no contributor
      # wrote it -- the branch head is the tip whose commits are under review (github.sha on a push).
      # What this narrows: a commit reachable only from the pull request's BASE is no longer judged
      # here. For a pull request into main the push lane judges it; for one into any other branch it
      # goes unjudged until that branch reaches main.
      - name: Commit-message check (every commit since the checker was added)
        # The tip is normally present already -- it is the merge commit's second parent and the
        # checkout is full-depth. Should the forge's merge ref lag the branch head it is not, and
        # the gate would fail closed naming a commit nobody can act on, so fetch it first. No
        # --depth: that would mark the clone shallow, which this gate refuses outright.
        run: |
          git fetch --no-tags origin "$TIP" || true
          python3 .github/ci/commit_msg_check.py --from-boundary --tip "$TIP"
        env:
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}

      # The trail's COMPOSITION, which no per-message check can see: the share of the recent
      # commits whose scope is `[docs]`. It reads the same window a person does -- the last 100,
      # ending at the branch head for the reason above -- so the number is about what the commit
      # list looks like now and not about a stretch that has scrolled out of sight.
      - name: Commit-trail drill
        run: python3 .github/ci/commit_trail_gate_drill.py

      - name: Commit trail ([docs] share of the last 100 commits)
        # The same fetch the message gate does, and for the same reason: the tip is normally the
        # merge commit's second parent and already present, but a merge ref lagging the branch
        # head would leave this naming a commit nobody can act on. Repeated rather than inherited
        # from the step above, so reordering these steps cannot break this one.
        run: |
          git fetch --no-tags origin "$TIP" || true
          python3 .github/ci/commit_trail_gate.py --tip "$TIP"
        env:
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Public-prose gate drill
        run: python3 .github/ci/public_prose_gate_drill.py

      - name: Public-prose gate
        run: python3 .github/ci/public_prose_gate.py

      # ledger_lint reads the ledger and the public docs, so most of it needs no
      # API and no compiler -- but it ran only in the manual build (advisory
      # there) and at release time. That is how README_COUNTS came to sit RED for
      # days after a prose sweep reworded the sentence it reads: the same silence
      # that let peerconn_gate fail unseen, and the same answer.
      - name: Ledger lint drill
        shell: pwsh
        run: ./.github/ci/ledger_lint_drill.ps1

      - name: Ledger lint, offline (fold grammar; the README's and install doc's claims)
        shell: pwsh
        run: ./.github/ci/ledger_lint.ps1 -SkipApi

      # The SOURCE invariants, which need no compiler and so do not belong behind a
      # twenty-minute Windows build. They lived only inside build-core once, and while the build
      # lane was manual a prose sweep deleted every `// GEN:` annotation in the net layer --
      # peerconn_gate had been failing for days with nothing to say so. These
      # scripts read source text, run on any platform, and cost about ten seconds together.
      # Anything that needs a BUILT DLL (abi_gate, the package drill) stays in build-core.
      - name: Peer-slot generation gate (every peerConns_ write decides occupancy)
        shell: pwsh
        run: ./.github/ci/peerconn_gate.ps1

      - name: Config registry gate (dead rows / write-only / alias / ratchet surface)
        shell: pwsh
        run: ./.github/ci/registry_gate.ps1

      - name: GC pin gate (a root-set pin is owned by a GcPin, never a hand-written pair)
        shell: pwsh
        run: ./.github/ci/gc_pin_gate.ps1

      - name: Atlas regime gate (the ImGui lazy atlas is on, watched, and bounded)
        shell: pwsh
        run: ./.github/ci/atlas_regime_gate.ps1

      - name: MinHook free-call gate (nothing may free a trampoline the process still calls)
        shell: pwsh
        run: ./.github/ci/minhook_free_gate.ps1

      - name: Master-contact gate (nothing tells an outside server where a player is, unasked)
        run: python3 .github/ci/master_contact_gate.py

      - name: ReliableKind routing gate (every wire kind reaches a receiver, or names why not)
        run: python3 .github/ci/reliablekind_gate.py
