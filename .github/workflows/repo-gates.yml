# repo-gates -- the checks on the repository's public surface, on every push.
#
# Three gates, each with the drill that shows it RED first (a gate nothing can
# show failing is a gate nobody can trust):
#   - public-leak: a leaked security coordinate in the public tree (its verbatim-overlap
#     ratchet needs the maintainer's local trees and reports n/a here; the three line
#     signals run everywhere)
#   - commit messages: the shape CONTRIBUTING.md asks for, over every commit
#     since the checker was added (.github/ci/commit_msg_check.py, the same
#     script the commit-msg hook runs)
#   - public prose: the working-notes markers, dead links and oversized files
#     in the public tree may not grow (.github/ci/public_prose_gate.py, a
#     ratchet against its committed baseline)
#
# Its own workflow file on purpose: build-core.yml's sha256 is part of the
# release fingerprint, so a gate step there would cost the fingerprint ritual
# on every edit.
name: repo-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Public-surface gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history -- the commit-message gate walks from its own boundary)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Public-leak gate drill
        run: python3 .github/ci/public_leak_gate_drill.py

      - name: Public-leak gate
        run: python3 .github/ci/public_leak_gate.py

      - name: Commit-message check drill
        run: python3 .github/ci/commit_msg_check_drill.py

      # A pull request is checked out as the ephemeral merge commit GitHub builds from the branch and
      # the base. That commit's `Merge <sha> into <sha>` subject can never pass, and no contributor
      # wrote it -- the branch head is the tip whose commits are under review (github.sha on a push).
      # What this narrows: a commit reachable only from the pull request's BASE is no longer judged
      # here. For a pull request into main the push lane judges it; for one into any other branch it
      # goes unjudged until that branch reaches main.
      - name: Commit-message check (every commit since the checker was added)
        # The tip is normally present already -- it is the merge commit's second parent and the
        # checkout is full-depth. Should the forge's merge ref lag the branch head it is not, and
        # the gate would fail closed naming a commit nobody can act on, so fetch it first. No
        # --depth: that would mark the clone shallow, which this gate refuses outright.
        run: |
          git fetch --no-tags origin "$TIP" || true
          python3 .github/ci/commit_msg_check.py --from-boundary --tip "$TIP"
        env:
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Public-prose gate drill
        run: python3 .github/ci/public_prose_gate_drill.py

      - name: Public-prose gate
        run: python3 .github/ci/public_prose_gate.py
