# Robot-tag drill (design section 4, R26/R27): an admin-authored throwaway
# workflow that EXPLICITLY declares contents:write (otherwise the read-only
# default token refuses BEFORE the ruleset is consulted -- fused-guard, and
# the drill would discriminate nothing) and attempts to create a v* tag.
# EXPECTED: the v-tags-admin-only ruleset rejects the push (github-actions is
# not a bypass actor). This drill simultaneously MEASURES the D10 limit: an
# explicit permissions: key DOES elevate past the read-only default.
name: drill-robot-tag
on: push
permissions:
  contents: write
jobs:
  tag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: attempt v-tag creation with GITHUB_TOKEN
        shell: pwsh
        run: |
          git tag v0.0.1-b1 HEAD
          git push origin v0.0.1-b1
          if ($LASTEXITCODE -eq 0) { Write-Host 'DRILL-FAIL: robot tag push SUCCEEDED (ruleset did not block)'; exit 1 }
          Write-Host "DRILL-OK: robot tag push REFUSED (exit $LASTEXITCODE)"
          exit 0
